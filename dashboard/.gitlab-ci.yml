stages:
  - build
  - deploy

variables:
  DEPLOY_PATH: /var/www/zemy

build:
  stage: build
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run generate
  artifacts:
    paths:
      - .output/public
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - build
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - rsync -avz --delete .output/public/ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'