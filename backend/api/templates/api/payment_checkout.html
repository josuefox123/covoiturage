<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Sécurisé - Zemy</title>
    
    <!-- FeexPay React SDK CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@feexpay/react-sdk@1.5.8/dist/style.css">
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #F9FAFB;
            color: #1F2937;
        }
        #root {
            width: 100%;
            max-width: 400px;
            background: #FFFFFF;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #E5E7EB;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo {
            height: 48px;
            object-fit: contain;
            margin-bottom: 12px;
        }
        .title {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            color: #1F2937;
        }
        .subtitle {
            font-size: 14px;
            color: #6B7280;
            margin: 4px 0 0 0;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2F80ED;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px 0;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            color: #DC2626;
            text-align: center;
            font-weight: 500;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="header">
            <img class="logo" src="https://api.feexpay.me/api/static/feexpay_logo-h.png" alt="FeexPay Logo">
            <h1 class="title">Finaliser le paiement</h1>
            <p class="subtitle">Sélectionnez votre moyen de paiement</p>
        </div>
        <div class="loader" id="page-loader"></div>
        <div id="payment-container" style="width: 100%;"></div>
    </div>

    <!-- ES Module Script mapping React and FeexPay SDK using esm.sh -->
    <script type="module">
        import React from 'https://esm.sh/react@18.3.1';
        import ReactDOM from 'https://esm.sh/react-dom@18.3.1/client';
        import { FeexPayProvider, FeexPayButton } from 'https://esm.sh/@feexpay/react-sdk@1.5.8';

        // Masquer le loader de chargement initial
        const loader = document.getElementById('page-loader');
        if (loader) loader.style.display = 'none';

        // Extraction des paramètres de l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const amount = parseInt(urlParams.get('amount') || '0', 10);
        const customId = urlParams.get('custom_id') || '';
        const description = urlParams.get('description') || 'Paiement Zemy';
        const fullname = urlParams.get('fullname') || 'Client Zemy';
        const email = urlParams.get('email') || 'client@zemy.bj';
        const phone = urlParams.get('phone') || '';

        // Identifiants serveur injectés par Django
        const merchantId = "{{ merchant_id }}";
        const apiToken = "{{ api_token }}";
        const mode = "{{ mode }}";

        function App() {
            const handleCallback = (response) => {
                console.log('FeexPay Callback received:', response);
                
                // Lorsque FeexPay renvoie un paiement réussi (le statut attendu dans le SDK est SUCCESSFUL ou SUCCESS)
                if (response && (response.status === 'SUCCESSFUL' || response.status === 'SUCCESS' || response.transaction_id)) {
                    const txId = response.transaction_id || response.reference;
                    const paymentMethod = response.reseau || 'LOCAL';
                    
                    // Notification à la WebView React Native
                    if (window.ReactNativeWebView) {
                        window.ReactNativeWebView.postMessage(JSON.stringify({
                            status: 'success',
                            transaction_id: txId,
                            amount: amount,
                            payment_method: paymentMethod
                        }));
                    } else {
                        // Fallback pour les tests web
                        const callbackUrl = urlParams.get('callback_url') || 'zemy://payments';
                        window.location.href = `${callbackUrl}?status=success&transaction_id=${txId}`;
                    }
                } else if (response && response.status === 'FAILED') {
                    // Notification d'échec
                    if (window.ReactNativeWebView) {
                        window.ReactNativeWebView.postMessage(JSON.stringify({
                            status: 'failed',
                            message: response.message || 'Le paiement a échoué.'
                        }));
                    }
                }
            };

            const handleErrorCallback = (error) => {
                console.error('FeexPay error callback:', error);
                if (window.ReactNativeWebView) {
                    window.ReactNativeWebView.postMessage(JSON.stringify({
                        status: 'failed',
                        message: 'Erreur lors de la transaction.'
                    }));
                }
            };

            return React.createElement(
                FeexPayProvider,
                null,
                React.createElement(FeexPayButton, {
                    amount: amount,
                    description: description,
                    id: merchantId,
                    token: apiToken,
                    customId: customId,
                    callback_url: urlParams.get('callback_url') || 'zemy://payments',
                    callback_info: {
                        description: description,
                        fullname: fullname,
                        email: email,
                        phone: phone
                    },
                    mode: mode,
                    currency: "XOF",
                    buttonText: `Payer ${amount} FCFA`,
                    buttonClass: "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md text-center block",
                    callback: handleCallback,
                    error_callback_url: urlParams.get('error_callback_url') || ''
                })
            );
        }

        const container = document.getElementById('payment-container');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(App));
    </script>
</body>
</html>
