{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Sécurisé - Zemy</title>
    
    <!-- FeexPay V2 React SDK does not require a separate stylesheet -->
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #F9FAFB;
            color: #1F2937;
        }
        #root {
            width: 100%;
            max-width: 400px;
            background: #FFFFFF;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #E5E7EB;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo {
            height: 48px;
            object-fit: contain;
            margin-bottom: 12px;
        }
        .title {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            color: #1F2937;
        }
        .subtitle {
            font-size: 14px;
            color: #6B7280;
            margin: 4px 0 0 0;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2F80ED;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px 0;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            color: #DC2626;
            text-align: center;
            font-weight: 500;
            margin: 10px 0;
        }
        .feexpay-btn {
            width: 100%;
            background-color: #2563EB;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 700;
            padding: 14px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            text-align: center;
            display: block;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2), 0 2px 4px -1px rgba(37, 99, 235, 0.1);
            transition: all 0.2s ease;
            box-sizing: border-box;
            margin-top: 16px;
        }
        .feexpay-btn:hover {
            background-color: #1D4ED8;
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(37, 99, 235, 0.3), 0 3px 6px -1px rgba(37, 99, 235, 0.15);
        }
        .feexpay-btn:active {
            transform: translateY(1px);
        }
        .form-group {
            width: 100%;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-sizing: border-box;
        }
        .input-label {
            font-size: 13px;
            font-weight: 600;
            color: #4B5563;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #D1D5DB;
            font-size: 15px;
            color: #1F2937;
            background-color: #FAFAFA;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-input:focus {
            outline: none;
            border-color: #2F80ED;
            box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.15);
            background-color: #FFFFFF;
        }
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
            width: 100%;
        }
        .zemy-logo {
            height: 38px;
            object-fit: contain;
        }
        .feexpay-logo {
            height: 28px;
            object-fit: contain;
        }
        .logo-separator {
            font-size: 20px;
            font-weight: bold;
            color: #9CA3AF;
        }
        .payment-methods-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin: 16px 0 8px 0;
            width: 100%;
        }
        .payment-logo-img {
            height: 32px;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid #E5E7EB;
            padding: 2px 8px;
            background-color: #FFFFFF;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="header">
            <div class="logo-container">
                <img class="zemy-logo" src="{% static 'logozemy.png' %}" alt="Zemy Logo" onerror="this.style.display='none';">
                <span class="logo-separator">+</span>
                <img class="feexpay-logo" src="https://api.feexpay.me/api/static/feexpay_logo-h.png" alt="FeexPay Logo" onerror="this.src='https://feexpay.me/wp-content/uploads/2022/08/logo_feexpay.png';">
            </div>
            <h1 class="title">Finaliser le paiement</h1>
            <p class="subtitle">Veuillez vérifier vos informations et payer</p>
        </div>
        <div class="loader" id="page-loader"></div>
        <div id="payment-container" style="width: 100%;"></div>
    </div>

    <!-- ES Module Script mapping React and FeexPay SDK using esm.sh -->
    <script type="module">
        // We use ?deps=react@18.3.1,react-dom@18.3.1 to force esm.sh to use the single shared React instance
        import React from 'https://esm.sh/react@18.3.1';
        import ReactDOM from 'https://esm.sh/react-dom@18.3.1/client';
        import FeexPay from 'https://esm.sh/react-sdk-feexpay?deps=react@18.3.1,react-dom@18.3.1';

        // Log handler for debugging inside webview
        window.onerror = function(message, source, lineno, colno, error) {
            console.error('JS Error:', message, 'at', source, 'line', lineno);
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    status: 'failed',
                    message: `Erreur JS: ${message} (Ligne ${lineno})`
                }));
            }
            return false;
        };

        try {
            console.log('Dependencies loaded successfully. Initializing parameters...');

            // Masquer le loader de chargement initial
            const loader = document.getElementById('page-loader');
            if (loader) loader.style.display = 'none';

            // Extraction des paramètres de l'URL
            const urlParams = new URLSearchParams(window.location.search);
            const amount = parseInt(urlParams.get('amount') || '0', 10);
            const customId = urlParams.get('custom_id') || '';
            const rawDescription = urlParams.get('description') || 'Paiement Zemy';
            // Clean description to remove accents, limit special characters and truncate to 40 chars for FeexPay compatibility
            const description = rawDescription
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-zA-Z0-9\s-_]/g, " ")
                .trim()
                .substring(0, 40);

            const rawFullname = urlParams.get('fullname') || 'Client Zemy';
            // Clean fullname to remove accents and special characters
            const fullname = rawFullname
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-zA-Z\s-]/g, " ")
                .trim();

            const email = urlParams.get('email') || 'client@zemy.bj';
            const rawPhone = urlParams.get('phone') || '';
            // Keep only digits (remove + prefix and other non-digits)
            const phone = rawPhone.replace(/\D/g, "");

            // Identifiants serveur injectés par Django
            const merchantId = "{{ merchant_id }}";
            const apiToken = "{{ api_token }}";
            const mode = "{{ mode }}";

            console.log(`Paiement info: Amount=${amount}, MerchantId=${merchantId}, Mode=${mode}`);

            function App() {
                const [fullnameState, setFullnameState] = React.useState(fullname);
                const [emailState, setEmailState] = React.useState(email);
                const [phoneState, setPhoneState] = React.useState(phone);

                const handleCallback = (response) => {
                    console.log('FeexPay Callback received:', response);
                    
                    if (response && (response.status === 'SUCCESSFUL' || response.status === 'SUCCESS' || response.transaction_id)) {
                        const txId = response.transaction_id || response.reference;
                        const paymentMethod = response.reseau || 'LOCAL';
                        
                        if (window.ReactNativeWebView) {
                            window.ReactNativeWebView.postMessage(JSON.stringify({
                                status: 'success',
                                transaction_id: txId,
                                amount: amount,
                                payment_method: paymentMethod
                            }));
                        } else {
                            const callbackUrl = urlParams.get('callback_url') || 'zemy://payments';
                            window.location.href = `${callbackUrl}?status=success&transaction_id=${txId}`;
                        }
                    } else if (response && response.status === 'FAILED') {
                        if (window.ReactNativeWebView) {
                            window.ReactNativeWebView.postMessage(JSON.stringify({
                                status: 'failed',
                                message: response.message || 'Le paiement a échoué.'
                            }));
                        }
                    }
                };

                const handleErrorCallback = (error) => {
                    console.error('FeexPay error callback:', error);
                    if (window.ReactNativeWebView) {
                        window.ReactNativeWebView.postMessage(JSON.stringify({
                            status: 'failed',
                            message: 'Erreur lors de la transaction.'
                        }));
                    }
                };

                const cleanedFullname = fullnameState.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z\s-]/g, " ").trim();
                const cleanedPhone = phoneState.replace(/\D/g, "");

                return React.createElement('div', { style: { width: '100%' } },
                    React.createElement('div', { className: 'form-group' },
                        React.createElement('label', { className: 'input-label' }, 'Nom complet'),
                        React.createElement('input', {
                            type: 'text',
                            className: 'form-input',
                            value: fullnameState,
                            onChange: (e) => setFullnameState(e.target.value)
                        })
                    ),
                    React.createElement('div', { className: 'form-group' },
                        React.createElement('label', { className: 'input-label' }, 'Adresse e-mail'),
                        React.createElement('input', {
                            type: 'email',
                            className: 'form-input',
                            value: emailState,
                            onChange: (e) => setEmailState(e.target.value)
                        })
                    ),
                    React.createElement('div', { className: 'form-group' },
                        React.createElement('label', { className: 'input-label' }, 'Numéro de téléphone (Mobile Money)'),
                        React.createElement('input', {
                            type: 'tel',
                            className: 'form-input',
                            placeholder: 'ex: 229XXXXXXXX',
                            value: phoneState,
                            onChange: (e) => setPhoneState(e.target.value)
                        })
                    ),
                    React.createElement('div', { className: 'payment-methods-logos' },
                        React.createElement('img', { 
                            src: 'https://feexpay.me/wp-content/uploads/2023/02/MTN-MoMo-Logo-PNG.png', 
                            alt: 'MTN Mobile Money', 
                            className: 'payment-logo-img',
                            onError: (e) => { e.target.src = 'https://api.feexpay.me/api/static/mtn_momo.png'; }
                        }),
                        React.createElement('img', { 
                            src: 'https://feexpay.me/wp-content/uploads/2023/02/Moov-Money-Logo.png', 
                            alt: 'Moov Money', 
                            className: 'payment-logo-img',
                            onError: (e) => { e.target.src = 'https://api.feexpay.me/api/static/moov_money.png'; }
                        })
                    ),
                    React.createElement('div', { style: { marginTop: '16px' } },
                        React.createElement(FeexPay, {
                            amount: amount,
                            description: description,
                            id: merchantId,
                            token: apiToken,
                            reference: customId,
                            callback_url: urlParams.get('callback_url') || 'zemy://payments',
                            callback_info: {
                                description: description,
                                fullname: cleanedFullname,
                                email: emailState,
                                phone: cleanedPhone
                            },
                            mode: mode.toLowerCase(),
                            currency: "XOF",
                            buttonText: `Payer ${amount} FCFA`,
                            buttonClass: "feexpay-btn",
                            callback: handleCallback,
                            error_callback_url: urlParams.get('error_callback_url') || ''
                        })
                    )
                );
            }

            console.log('Rendering FeexPayButton component...');
            const container = document.getElementById('payment-container');
            const root = ReactDOM.createRoot(container);
            root.render(React.createElement(App));
            console.log('FeexPay component mounted successfully.');
        } catch (error) {
            console.error('Crash during script setup:', error);
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    status: 'failed',
                    message: `Crash Setup JS: ${error.message || error}`
                }));
            }
        }
    </script>
</body>
</html>
