openapi: 3.0.3
info:
  title: Zemy API
  version: 1.0.0
  description: |-
    Documentation officielle de l'API Zemy.

    Cette API permet de gérer :

    • Authentification
    • Utilisateurs
    • Conducteurs
    • Passagers
    • Trajets
    • Réservations
    • Paiements
    • Colis
    • Vérification des comptes
    • Notifications
    • Messagerie
    • Dashboard Administrateur
  contact:
    name: Support Zemy
    email: support@zemy.app
  license:
    name: Propriétaire
