      operationId: auth_fcm_token_create
      description: |-
        Enregistre le token FCM de l'appareil de l'utilisateur connecté.
        Appelé par le mobile après la connexion ou au lancement de l'app.
      tags:
      - Notifications
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
