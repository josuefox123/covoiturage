stages:
  - test
  - deploy

# Tests avec SQLite (pas besoin de PostgreSQL pour les tests)
test-backend:
  stage: test
  image: python:3.12
  variables:
    DEBUG: "True"
    DJANGO_ENV: "ci"
    DB_ENGINE: "sqlite3"
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip/
  before_script:
    - apt-get update -qq && apt-get install -y -qq default-libmysqlclient-dev build-essential pkg-config > /dev/null 2>&1 || true
    - pip install --cache-dir .cache/pip -r requirements.txt
  script:
    - python manage.py test api --verbosity=2
  only:
    - main
    - master
    - josue
    - testeur
    - develop
    - merge_requests

# Deploiement sur VPS — automatique apres les tests
deploy-backend:
  stage: deploy
  image: alpine:latest
  environment:
    name: production
    url: https://zemybackend.sinustic.com/
  before_script:
    - if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then echo "Variables VPS non configurees dans GitLab CI. Saut du deploiement." && exit 0; fi
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh -i ~/.ssh/deploy_key deploy@$VPS_HOST "set -e
      echo 'Pull du code...'
      cd /var/www/zemybackend
      git fetch https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/sinustic1/zemy_backend.git $CI_COMMIT_REF_NAME
      git reset --hard FETCH_HEAD
      git clean -fd
      echo 'Activation du venv...'
      source venv/bin/activate
      echo 'Installation des dependances...'
      pip install -r requirements.txt --quiet
      echo 'Migrations...'
      python manage.py migrate --no-input
      echo 'Fichiers statiques...'
      python manage.py collectstatic --no-input
      echo 'Redemarrage Gunicorn...'
      sudo systemctl restart zemybackend-gunicorn
      echo 'Deploiement backend termine !'"
  only:
    - main
    - master
    - develop
  needs:
    - test-backend
